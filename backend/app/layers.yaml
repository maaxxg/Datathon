# Machine-readable catalogue of data sources.
# Used for the "Izvori podataka" page, report citations and query validation.
# Coverage bboxes are [min_lon, min_lat, max_lon, max_lat] in WGS84.

layers:
  flood_hv:
    title: Karte opasnosti od poplava 2019.
    publisher: Hrvatske vode
    licence: bez ograničenja pristupa (WMS AccessConstraints NONE); skup nije objavljen na data.gov.hr
    url: https://servisi.voda.hr/wms
    info_url: https://www.voda.hr/hr/karte-opasnosti-od-poplava-karte-rizika-od-poplava-2019
    year: 2019
    resolution: render WMS-a (GetMap), dubina u razredima
    coverage: croatia
    scenarios: [velika, srednja, mala]
    classes: [none, d_lt_0_5, d_0_5_1_5, d_1_5_2_5, d_gt_2_5, permanent_water]

  flood_efas:
    title: EFAS river flood hazard maps v3.1.1
    publisher: Europska komisija, JRC (Copernicus EMS)
    licence: ODbL 1.0
    url: https://jeodpp.jrc.ec.europa.eu/ftp/public/JRC-OpenData/CEMS-EFAS/flood_hazard/
    info_url: https://doi.org/10.2905/1D128B6C-A4EE-4858-9E34-6210707F3C81
    year: 2024
    resolution: 90 m
    coverage: croatia
    note: koristi se samo gdje karta Hrvatskih voda nema podatka

  seismic:
